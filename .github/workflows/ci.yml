name: Spark training and API tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install -r requirements.txt -c requirements.lock
      - run: python -m oilsense.train
      - run: pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: trained-spark-pipelines
          path: artifacts/
